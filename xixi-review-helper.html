<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>嘻嘻 Hair Salon｜評論小幫手</title>
<style>
:root{--bg:#f7f2ea;--card:#fffdf9;--ink:#292521;--muted:#766f68;--line:#ddd3c7;--accent:#292521}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:560px;margin:auto;padding:34px 18px 48px}
.brand{text-align:center;margin-bottom:28px}.brand .moon{font-size:34px}.brand h1{font-size:25px;margin:7px 0}.brand p{color:var(--muted);margin:0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 8px 28px rgba(40,30,20,.05)}
h2{font-size:17px;margin:0 0 13px}
.options{display:flex;flex-wrap:wrap;gap:9px}
button{font:inherit}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;color:var(--ink)}
.chip.active{background:var(--accent);color:white;border-color:var(--accent)}
.primary,.secondary{width:100%;border:0;border-radius:15px;padding:15px;margin-top:10px;font-weight:700}
.primary{background:var(--accent);color:white}.secondary{background:#eee7de;color:var(--ink)}
textarea{width:100%;min-height:145px;resize:vertical;border:1px solid var(--line);border-radius:15px;padding:14px;font:inherit;line-height:1.65;background:#fff;color:var(--ink)}
.small{text-align:center;color:var(--muted);font-size:12px;line-height:1.6;margin-top:16px}
.status{text-align:center;font-size:13px;min-height:20px;margin-top:7px;color:#4f6a51}
</style>
</head>
<body>
<main>
  <div class="brand">
    <div class="moon">☾ ✦</div>
    <h1>嘻嘻 Hair Salon</h1>
    <p>謝謝你今天來找我們 ♡ 幫你快速整理一下真實感受</p>
  </div>

  <div class="card">
    <h2>今天做了什麼？</h2>
    <div class="options" id="services"></div>
  </div>

  <div class="card">
    <h2>今天最有感的是？（可複選）</h2>
    <div class="options" id="feelings"></div>
  </div>

  <button class="primary" id="generate">✨ 幫我整理評論</button>

  <div class="card">
    <h2>你的評論草稿</h2>
    <textarea id="output" placeholder="選好上面的項目後，點「幫我整理評論」"></textarea>
    <button class="primary" id="copy">📋 複製評論</button>
    <button class="secondary" id="google">前往 Google 留下評論</button>
    <div class="status" id="status"></div>
  </div>
  <div class="small">內容只是協助整理你的真實體驗，你可以自由修改。星等與是否發布都由你自己決定。</div>
</main>
<script>
const MAPS_URL="https://maps.app.goo.gl/QWEvYp2zrz7M4tUV6?g_st=ic";
const services=["剪髮","染髮","漂髮","燙髮","縮毛矯正","護髮"];
const feelings=["溝通仔細","效果自然","顏色喜歡","很好整理","服務親切","環境舒服","很有耐心","整體很滿意"];
let selectedService="", selectedFeelings=[];

function mount(){
 const s=document.getElementById("services");
 services.forEach(x=>{let b=document.createElement("button");b.className="chip";b.textContent=x;b.onclick=()=>{[...s.children].forEach(v=>v.classList.remove("active"));b.classList.add("active");selectedService=x};s.appendChild(b)});
 const f=document.getElementById("feelings");
 feelings.forEach(x=>{let b=document.createElement("button");b.className="chip";b.textContent=x;b.onclick=()=>{b.classList.toggle("active");selectedFeelings=b.classList.contains("active")?[...selectedFeelings,x]:selectedFeelings.filter(v=>v!==x)};f.appendChild(b)});
}
const intros=[
 s=>`今天來做${s}，`,
 s=>`這次來嘻嘻做${s}，`,
 s=>`今天來整理頭髮，做了${s}，`
];
const phrase={
"溝通仔細":["做之前會很仔細溝通想要的感覺","過程中溝通得很仔細"],
"效果自然":["完成後的效果很自然","做完呈現的感覺很自然"],
"顏色喜歡":["最後的顏色很喜歡","染完的顏色很符合我想要的感覺"],
"很好整理":["回去應該也會很好整理","做完頭髮變得更好整理"],
"服務親切":["服務很親切，不會有壓力","整個服務過程很親切"],
"環境舒服":["店裡環境很舒服","整體空間讓人很放鬆"],
"很有耐心":["設計師很有耐心地確認細節","過程中很有耐心"],
"整體很滿意":["整體體驗很滿意","這次整理完很滿意"]
};
const ends=["，整個過程都很舒服～","，謝謝今天幫我把頭髮整理得這麼好！","，是一次很舒服的整理體驗。","，做完很喜歡😊"];
function pick(a){return a[Math.floor(Math.random()*a.length)]}
document.getElementById("generate").onclick=()=>{
 if(!selectedService){document.getElementById("status").textContent="先選一下今天做的服務喔";return}
 let fs=selectedFeelings.length?selectedFeelings:["整體很滿意"];
 let pieces=fs.slice(0,3).map(x=>pick(phrase[x]));
 let text=pick(intros)(selectedService)+pieces.join("，")+pick(ends);
 document.getElementById("output").value=text.replace(/，，/g,"，");
 document.getElementById("status").textContent="已幫你整理好，可以自由修改 ♡";
};
document.getElementById("copy").onclick=async()=>{
 const text=document.getElementById("output").value.trim();
 if(!text){document.getElementById("status").textContent="先產生一段評論喔";return}
 try{await navigator.clipboard.writeText(text);document.getElementById("status").textContent="✓ 已複製！接著前往 Google 貼上即可"}
 catch(e){document.getElementById("output").select();document.execCommand("copy");document.getElementById("status").textContent="✓ 已複製"}
};
document.getElementById("google").onclick=()=>window.open(MAPS_URL,"_blank");
mount();
</script>
</body>
</html>
