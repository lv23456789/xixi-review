<style>*{box-sizing:border-box}body{margin:0;background:#f7f2ea;color:#292521;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}main{max-width:560px;margin:auto;padding:32px 18px}.brand{text-align:center;margin-bottom:24px}.brand h1{margin:6px;font-size:25px}.brand p,.small{color:#766f68}.card{background:#fffdf9;border:1px solid #ddd3c7;border-radius:22px;padding:20px;margin:14px 0}h2{font-size:17px;margin:0 0 13px}.options{display:flex;flex-wrap:wrap;gap:9px}.chip{border:1px solid #ddd3c7;background:#fff;border-radius:999px;padding:10px 14px}.chip.active{background:#292521;color:#fff}.primary,.secondary{width:100%;border:0;border-radius:15px;padding:15px;margin-top:10px;font-weight:700}.primary{background:#292521;color:#fff}.secondary{background:#eee7de}textarea{width:100%;min-height:190px;border:1px solid #ddd3c7;border-radius:15px;padding:14px;font:inherit;line-height:1.7}.small{text-align:center;font-size:12px;line-height:1.6;margin-top:16px}.status{text-align:center;font-size:13px;min-height:20px;margin-top:7px;color:#4f6a51}</style></head><body><main>

const pick=a=>a[Math.floor(Math.random()*a.length)],shuffle=a=>[...a].sort(()=>Math.random()-.5);
